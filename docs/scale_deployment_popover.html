
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --win-bg: #1e1e1e; --win-bg2: #252526; --win-border: rgba(255,255,255,0.08);
  --text1: #e0e0e0; --text2: #999; --text3: #666;
  --green: #32d74b; --orange: #ff9f0a; --red: #ff453a;
  --blue-accent: #0a84ff; --separator: rgba(255,255,255,0.06);
  --sheet-bg: #2a2a2a; --sheet-border: rgba(255,255,255,0.12);
  --input-bg: #1a1a1a; --input-border: rgba(255,255,255,0.12);
  --btn-primary: #0a84ff;
}
@media (prefers-color-scheme: light) {
  :root {
    --win-bg: #f5f5f5; --win-bg2: #ffffff; --win-border: rgba(0,0,0,0.12);
    --text1: #1d1d1f; --text2: #6e6e73; --text3: #aeaeb2;
    --green: #34c759; --orange: #ff9500; --red: #ff3b30;
    --blue-accent: #007aff; --separator: rgba(0,0,0,0.06);
    --sheet-bg: #ffffff; --sheet-border: rgba(0,0,0,0.12);
    --input-bg: #ffffff; --input-border: rgba(0,0,0,0.15);
    --btn-primary: #007aff;
  }
}
.wrapper { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; color: var(--text1); -webkit-font-smoothing: antialiased; display: flex; justify-content: center; padding: 1rem 0; }
.popover {
  background: var(--sheet-bg); border: 0.5px solid var(--sheet-border); border-radius: 10px;
  padding: 16px 20px; width: 280px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.25);
  position: relative;
}
.popover::before {
  content: ''; position: absolute; top: -6px; left: 50%; transform: translateX(-50%) rotate(45deg);
  width: 12px; height: 12px; background: var(--sheet-bg); border-left: 0.5px solid var(--sheet-border); border-top: 0.5px solid var(--sheet-border);
}
.pop-title { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
.pop-target { font-family: "SF Mono","Menlo",monospace; font-size: 11px; color: var(--blue-accent); margin-bottom: 14px; }
.current-state { display: flex; gap: 16px; margin-bottom: 14px; padding-bottom: 12px; border-bottom: 0.5px solid var(--separator); }
.state-item { display: flex; flex-direction: column; gap: 2px; }
.state-label { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.3px; }
.state-value { font-size: 18px; font-weight: 600; font-family: "SF Mono","Menlo",monospace; }
.state-value.healthy { color: var(--green); }
.state-value.mismatch { color: var(--orange); }
.stepper-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.stepper-label { font-size: 12px; color: var(--text2); flex-shrink: 0; }
.stepper {
  display: flex; align-items: center; border: 0.5px solid var(--input-border); border-radius: 6px; overflow: hidden;
}
.stepper-btn {
  width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
  background: var(--input-bg); border: none; color: var(--text1); font-size: 16px; cursor: pointer;
  font-weight: 500;
}
.stepper-btn:hover { background: rgba(128,128,128,0.15); }
.stepper-val {
  width: 48px; height: 32px; text-align: center; border: none; border-left: 0.5px solid var(--input-border); border-right: 0.5px solid var(--input-border);
  background: var(--input-bg); color: var(--text1); font-size: 16px; font-weight: 600; font-family: "SF Mono","Menlo",monospace;
}
.change-indicator { font-size: 11px; color: var(--orange); font-weight: 500; display: flex; align-items: center; gap: 4px; }
.copy-cmd { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text3); margin-bottom: 14px; padding-bottom: 12px; border-bottom: 0.5px solid var(--separator); cursor: pointer; }
.copy-cmd:hover { color: var(--blue-accent); }
.copy-cmd code { font-family: "SF Mono","Menlo",monospace; font-size: 10px; color: var(--text2); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.actions { display: flex; gap: 8px; justify-content: flex-end; }
.btn { padding: 6px 14px; border-radius: 6px; font-size: 13px; font-weight: 500; border: none; cursor: pointer; }
.btn-cancel { background: rgba(128,128,128,0.1); color: var(--text1); }
.btn-apply { background: var(--btn-primary); color: #fff; }
</style>

<div class="wrapper">
  <div class="popover">
    <div class="pop-title">Scale deployment</div>
    <div class="pop-target">api-gateway</div>
    <div class="current-state">
      <div class="state-item">
        <span class="state-label">Desired</span>
        <span class="state-value">3</span>
      </div>
      <div class="state-item">
        <span class="state-label">Ready</span>
        <span class="state-value healthy">3</span>
      </div>
      <div class="state-item">
        <span class="state-label">Available</span>
        <span class="state-value healthy">3</span>
      </div>
    </div>
    <div class="stepper-row">
      <span class="stepper-label">New replicas</span>
      <div class="stepper">
        <button class="stepper-btn">−</button>
        <input class="stepper-val" value="5" readonly>
        <button class="stepper-btn">+</button>
      </div>
    </div>
    <div class="change-indicator" style="margin-bottom:14px;">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 20V4M5 11l7-7 7 7"/></svg>
      Scaling from 3 → 5 replicas
    </div>
    <div class="copy-cmd">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
      <code>kubectl scale deployment/api-gateway --replicas=5 -n default</code>
    </div>
    <div class="actions">
      <button class="btn btn-cancel">Cancel</button>
      <button class="btn btn-apply">Apply</button>
    </div>
  </div>
</div>
