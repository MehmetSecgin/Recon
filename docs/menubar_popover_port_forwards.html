
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --pop-bg: #2b2b2b; --pop-border: rgba(255,255,255,0.1); --pop-hover: rgba(255,255,255,0.06);
  --text1: #e0e0e0; --text2: #999; --text3: #666;
  --green: #32d74b; --red: #ff453a; --blue-accent: #0a84ff;
  --separator: rgba(255,255,255,0.06);
  --section-bg: rgba(255,255,255,0.03);
}
@media (prefers-color-scheme: light) {
  :root {
    --pop-bg: #ffffff; --pop-border: rgba(0,0,0,0.12); --pop-hover: rgba(0,0,0,0.04);
    --text1: #1d1d1f; --text2: #6e6e73; --text3: #aeaeb2;
    --green: #34c759; --red: #ff3b30; --blue-accent: #007aff;
    --separator: rgba(0,0,0,0.06);
    --section-bg: rgba(0,0,0,0.02);
  }
}
.wrapper { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; color: var(--text1); -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; align-items: center; padding: 1rem 0; gap: 8px; }
.menubar-hint { font-size: 11px; color: var(--text3); display: flex; align-items: center; gap: 6px; }
.menubar-icon { width: 20px; height: 20px; border-radius: 4px; background: var(--pop-bg); border: 0.5px solid var(--pop-border); display: flex; align-items: center; justify-content: center; }
.popover {
  background: var(--pop-bg); border: 0.5px solid var(--pop-border); border-radius: 10px;
  width: 300px; overflow: hidden;
  box-shadow: 0 8px 40px rgba(0,0,0,0.3);
}
.pop-section { padding: 10px 14px; border-bottom: 0.5px solid var(--separator); }
.pop-status { display: flex; align-items: center; gap: 8px; }
.status-indicator { width: 8px; height: 8px; border-radius: 50%; }
.status-label { font-size: 13px; font-weight: 500; flex: 1; }
.status-detail { font-size: 11px; color: var(--text2); }
.pop-ctx { font-size: 11px; color: var(--text3); margin-top: 4px; display: flex; gap: 12px; }
.pop-ctx .val { font-family: "SF Mono","Menlo",monospace; font-size: 10px; color: var(--text2); }

.pop-menu-item {
  display: flex; align-items: center; gap: 8px; padding: 7px 14px;
  font-size: 13px; cursor: pointer; transition: background .1s;
}
.pop-menu-item:hover { background: var(--pop-hover); }
.pop-menu-item svg { opacity: 0.5; flex-shrink: 0; }

.fwd-section { background: var(--section-bg); }
.fwd-header { display: flex; align-items: center; justify-content: space-between; padding: 8px 14px; }
.fwd-title { font-size: 11px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 0.3px; display: flex; align-items: center; gap: 6px; }
.fwd-count { font-size: 10px; background: var(--green); color: #fff; padding: 1px 5px; border-radius: 6px; font-weight: 600; }
.stop-all { font-size: 11px; color: var(--red); cursor: pointer; }

.fwd-item { display: flex; align-items: center; gap: 8px; padding: 6px 14px; }
.fwd-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
.fwd-info { flex: 1; min-width: 0; }
.fwd-name { font-size: 12px; font-family: "SF Mono","Menlo",monospace; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fwd-ports { font-size: 11px; color: var(--text3); font-family: "SF Mono","Menlo",monospace; }
.fwd-stop { font-size: 10px; color: var(--red); cursor: pointer; opacity: 0.6; padding: 2px 6px; border-radius: 3px; border: 0.5px solid transparent; }
.fwd-stop:hover { opacity: 1; border-color: var(--red); }

.pop-footer { padding: 4px 14px 8px; }
.pop-footer-item { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 12px; color: var(--text2); cursor: pointer; }
.pop-footer-item:hover { color: var(--text1); }
</style>

<div class="wrapper">
  <div class="menubar-hint">
    <div class="menubar-icon">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/></svg>
    </div>
    Menu bar popover — Recon
  </div>

  <div class="popover">
    <div class="pop-section">
      <div class="pop-status">
        <div class="status-indicator" style="background:var(--green)"></div>
        <span class="status-label">Connected</span>
        <span class="status-detail">Telepresence 2.20</span>
      </div>
      <div class="pop-ctx">
        <span>ctx: <span class="val">prod-eu-west-1</span></span>
        <span>ns: <span class="val">default</span></span>
      </div>
    </div>

    <div>
      <div class="pop-menu-item">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
        Reconnect
      </div>
      <div class="pop-menu-item">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Cluster browser
      </div>
    </div>

    <div class="fwd-section" style="border-top: 0.5px solid var(--separator);">
      <div class="fwd-header">
        <div class="fwd-title">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17l9.2-9.2M17 17V7.8H7.8"/></svg>
          Port forwards
          <span class="fwd-count">3</span>
        </div>
        <span class="stop-all">Stop all</span>
      </div>
      <div class="fwd-item">
        <div class="fwd-dot" style="background:var(--green)"></div>
        <div class="fwd-info">
          <div class="fwd-name">pod/api-gateway-5d4e8</div>
          <div class="fwd-ports">8080 → 8080</div>
        </div>
        <span class="fwd-stop">Stop</span>
      </div>
      <div class="fwd-item">
        <div class="fwd-dot" style="background:var(--green)"></div>
        <div class="fwd-info">
          <div class="fwd-name">svc/auth-service</div>
          <div class="fwd-ports">3000 → 3000</div>
        </div>
        <span class="fwd-stop">Stop</span>
      </div>
      <div class="fwd-item">
        <div class="fwd-dot" style="background:var(--green)"></div>
        <div class="fwd-info">
          <div class="fwd-name">pod/order-processor-e3a09</div>
          <div class="fwd-ports">9090 → 9090</div>
        </div>
        <span class="fwd-stop">Stop</span>
      </div>
    </div>

    <div class="pop-footer" style="border-top: 0.5px solid var(--separator);">
      <div class="pop-footer-item">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12.22 2h-.44a2 2 0 00-2 2v.18a2 2 0 01-1 1.73l-.43.25a2 2 0 01-2 0l-.15-.08a2 2 0 00-2.73.73l-.22.38a2 2 0 00.73 2.73l.15.1a2 2 0 011 1.72v.51a2 2 0 01-1 1.74l-.15.09a2 2 0 00-.73 2.73l.22.38a2 2 0 002.73.73l.15-.08a2 2 0 012 0l.43.25a2 2 0 011 1.73V20a2 2 0 002 2h.44a2 2 0 002-2v-.18a2 2 0 011-1.73l.43-.25a2 2 0 012 0l.15.08a2 2 0 002.73-.73l.22-.39a2 2 0 00-.73-2.73l-.15-.08a2 2 0 01-1-1.74v-.5a2 2 0 011-1.74l.15-.09a2 2 0 00.73-2.73l-.22-.38a2 2 0 00-2.73-.73l-.15.08a2 2 0 01-2 0l-.43-.25a2 2 0 01-1-1.73V4a2 2 0 00-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        Preferences…
      </div>
      <div class="pop-footer-item">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        Diagnostics
      </div>
      <div class="pop-footer-item" style="color:var(--red);">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18.36 6.64A9 9 0 015.64 18.36 9 9 0 0118.36 5.64z"/></svg>
        Quit Recon
      </div>
    </div>
  </div>
</div>
